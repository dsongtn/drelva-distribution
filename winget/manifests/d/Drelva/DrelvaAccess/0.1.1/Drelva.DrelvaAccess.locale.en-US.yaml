ShortDescription: Opt-in gateway for owner-approved private software access.
Description: |
  Drelva Access is a public, credential-free gateway client for privately
  managed software. It checks the public identity server and requests
  explicit browser-based device approval. Private packages and their
  authorization remain server controlled. OAuth enrollment is not yet
  enabled for this development preview.
